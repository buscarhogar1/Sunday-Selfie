// Countdown to next Sunday midnight
function getCountdown() {
  const now = new Date();
  const next = new Date(now);
  const day = now.getDay(); // 0=Sun
  const daysUntil = day === 0 ? 7 : 7 - day;
  next.setDate(now.getDate() + daysUntil);
  next.setHours(0, 0, 0, 0);
  const diff = Math.max(0, next - now);
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return `${String(d).padStart(2,'0')}:${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function useCountdown() {
  const [cd, setCd] = useState(getCountdown());
  useEffect(() => {
    const t = setInterval(() => setCd(getCountdown()), 1000);
    return () => clearInterval(t);
  }, []);
  return cd;
}

// Weeks active from createdAt
function weeksActive(createdAt) {
  const now = new Date();
  const created = new Date(createdAt);
  // Find first Sunday after creation (not same day if Sunday)
  const dayOfWeek = created.getDay();
  const daysToFirst = dayOfWeek === 0 ? 7 : 7 - dayOfWeek;
  const firstSunday = new Date(created);
  firstSunday.setDate(created.getDate() + daysToFirst);
  firstSunday.setHours(0, 0, 0, 0);
  if (firstSunday > now) return 0;
  const diff = now - firstSunday;
  return Math.floor(diff / (7 * 24 * 3600 * 1000));
}

// ── SCREEN: ONBOARDING PHOTO ───────────────────────────────────────────────────
const OnboardingPhoto = ({ navigate }) => {
  const [hasPhoto, setHasPhoto] = useState(false);
  const [selectedStyle, setSelectedStyle] = useState(null);
  const [showSheet, setShowSheet] = useState(false);
  const [loading, setLoading] = useState(false);
  const [alert, setAlert] = useState(null);
  const PHOTO_COLOR = '#F4A261';

  const avatarStyles = [
    { id: 'ilustracion', label: 'Ilustración', color: '#6BB5F4' },
    { id: 'acuarela', label: 'Acuarela', color: '#F7C3D0' },
    { id: 'comic', label: 'Cómic', color: '#FFD166' },
    { id: 'pixel', label: 'Pixel art', color: '#A8D8A8' },
    { id: 'boceto', label: 'Boceto', color: '#C3A6F7' },
    { id: 'clay', label: 'Clay 3D', color: '#F08080' },

  const handlePickSource = (source) => {
    setShowSheet(false);
    setLoading(true);
    setTimeout(() => { setHasPhoto(true); setLoading(false); }, 1400);

    setSelectedStyle(style);
    setLoading(true);

    if (hasPhoto && !selectedStyle) {
      setAlert('Debes elegir un filtro para tu imagen de perfil');
      return;
    }
    navigate('home');
  };

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: 'var(--bg)', padding: 24, position: 'relative' }}>
      {/* Centered logo */}
      <div style={{ paddingTop: 54, marginBottom: 36, textAlign: 'center' }}>
        <Logo size={24}/>
        <div style={{ marginTop: 20, display: 'flex', gap: 6 }}>
          {[1,2].map(i => <div key={i} style={{ height: 3, flex: 1, borderRadius: 4, background: 'var(--orange)' }}/>)}
        </div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto' }}>
        <h2 style={{ fontSize: 26, fontWeight: 700, color: 'var(--text)', marginBottom: 6 }}>Foto de perfil</h2>
        <p style={{ color: 'var(--text-2)', fontSize: 14, marginBottom: 28 }}>La foto de perfil se podrá cambiar cada domingo</p>

        {/* Avatar circle with + badge */}
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 28, position: 'relative', width: 'fit-content', margin: '0 auto 28px' }}>
          <button onClick={() => !hasPhoto && setShowSheet(true)} style={{
            width: 100, height: 100, borderRadius: '50%',
            background: hasPhoto ? (selectedStyle ? selectedStyle.color : PHOTO_COLOR) : '#F0EBE3',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            border: '3px solid white', boxShadow: '0 4px 16px rgba(0,0,0,0.1)',
            cursor: 'pointer', position: 'relative', overflow: 'visible',
            padding: 0,
          }}>
            {loading ? (
              <div style={{ width: 36, height: 36, border: '3px solid rgba(255,255,255,0.4)', borderTopColor: 'white', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }}/>
            ) : hasPhoto ? (
              <span style={{ color: 'white', fontWeight: 700, fontSize: 32 }}>LM</span>
            ) : (
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <path d="M20 20C22.76 20 25 17.76 25 15C25 12.24 22.76 10 20 10C17.24 10 15 12.24 15 15C15 17.76 17.24 20 20 20Z" fill="#AEAEB2"/>
                <path d="M8 30C8 25.58 13.37 22 20 22C26.63 22 32 25.58 32 30" stroke="#AEAEB2" strokeWidth="2" strokeLinecap="round"/>
              </svg>
            )}
          </button>
          {/* + badge */}
          <button onClick={() => setShowSheet(true)} style={{
            position: 'absolute', bottom: 2, right: 2,
            width: 28, height: 28, borderRadius: '50%',
            background: 'var(--orange)', border: '2.5px solid white',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', padding: 0,
          }}>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M6 1v10M1 6h10" stroke="white" strokeWidth="2" strokeLinecap="round"/>
            </svg>
          </button>
        </div>

        {/* Style selector — shown only after photo */}
        {hasPhoto && (
          <div>
            <p style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-2)', marginBottom: 12, textAlign: 'center' }}>Elige un estilo para tu avatar</p>
            <div style={{ display: 'flex', gap: 10, overflowX: 'auto', paddingBottom: 4 }}>
              {avatarStyles.map(s => (
                <div key={s.id} onClick={() => handleStyleSelect(s)} style={{ flexShrink: 0, textAlign: 'center', cursor: 'pointer' }}>
                  <div style={{
                    width: 52, height: 52, borderRadius: '50%',
                    background: s.color,
                    border: selectedStyle?.id === s.id ? `3px solid var(--orange)` : '3px solid white',
                    boxShadow: selectedStyle?.id === s.id ? '0 0 0 2px var(--orange)' : '0 2px 8px rgba(0,0,0,0.08)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: 'white', fontWeight: 700, fontSize: 16, marginBottom: 4,
                  }}>LM</div>
                  <p style={{ fontSize: 10, color: selectedStyle?.id === s.id ? 'var(--orange-d)' : 'var(--text-2)', fontWeight: selectedStyle?.id === s.id ? 600 : 400 }}>{s.label}</p>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Alert */}
      {alert && (
        <div style={{
          position: 'absolute', top: '50%', left: 24, right: 24,
          background: 'white', borderRadius: 16, padding: '20px',
          boxShadow: '0 8px 32px rgba(0,0,0,0.18)', zIndex: 200, textAlign: 'center',
          transform: 'translateY(-50%)',

          <button onClick={() => setAlert(null)} style={{
            background: 'var(--orange)', color: 'white', border: 'none', borderRadius: 10,
            padding: '10px 24px', fontFamily: "'DM Sans'", fontWeight: 600, fontSize: 14, cursor: 'pointer',
          }}>Entendido</button>
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 16 }}>
        <Btn onPress={handleStart}>¡Empezar!</Btn>
        <Btn onPress={() => navigate('onboarding-name')} variant="ghost">Atrás</Btn>
      </div>

      {/* Bottom sheet */}
      {showSheet && (
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'flex-end', zIndex: 100 }} onClick={() => setShowSheet(false)}>
          <div onClick={e => e.stopPropagation()} style={{ background: 'white', borderRadius: '24px 24px 0 0', padding: '20px 24px 36px', width: '100%' }}>
            <div style={{ width: 36, height: 4, background: 'var(--border)', borderRadius: 4, margin: '0 auto 20px' }}/>
            <h3 style={{ fontWeight: 700, fontSize: 17, marginBottom: 16 }}>Elige una foto</h3>
            {['Galería', 'Cámara'].map(opt => (
              <button key={opt} onClick={() => handlePickSource(opt)} style={{
                width: '100%', padding: '14px', background: 'var(--bg)',
                border: 'none', borderRadius: 12, fontFamily: "'DM Sans'",
                fontWeight: 600, fontSize: 16, color: 'var(--text)',
                cursor: 'pointer', marginBottom: 10, textAlign: 'left',
              }}>{opt === 'Galería' ? '🖼 ' : '📷 '}{opt}</button>
            ))}
          </div>
        </div>
      )}
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
};

const GroupScreen = ({ group, navigate, goBack }) => {
  const [weekIdx, setWeekIdx] = useState(0);
  const week = group.weeks[weekIdx];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: 'var(--bg)', overflow: 'hidden' }}>
      <AppHeader
        onBack={goBack}
        subtitle={`${group.name.split(' ').slice(0,2).join(' ')} · ${group.memberCount} miembros`}
        right={
          <button onClick={() => navigate('members', group)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}>
            {/* Three vertical dots */}
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle cx="11" cy="5" r="1.6" fill="var(--orange)"/>
              <circle cx="11" cy="11" r="1.6" fill="var(--orange)"/>
              <circle cx="11" cy="17" r="1.6" fill="var(--orange)"/>
            </svg>
          </button>
        }
      />

      {/* Week selector row — scrollable, with counter inline */}
      <div className="week-scroll" style={{ overflowX: 'auto', paddingLeft: 16, paddingRight: 16, display: 'flex', gap: 8, paddingBottom: 10, flexShrink: 0, alignItems: 'center' }}>
        {group.weeks.map((w, i) => {
          const weekNum = w.key.split('-W')[1];
          const year = w.key.split('-W')[0];
          const label = i === 0 ? 'Esta semana' : `Semana ${weekNum} / ${year}`;
          const postsCount = w.posts.length;
          return (
            <button key={w.key} onClick={() => setWeekIdx(i)} style={{
              flexShrink: 0, display: 'flex', alignItems: 'center', gap: 8,
              padding: '8px 14px', borderRadius: 20,
              background: weekIdx === i ? 'var(--orange)' : 'white',
              color: weekIdx === i ? 'white' : 'var(--text-2)',
              border: weekIdx === i ? 'none' : '1.5px solid var(--border)',
              fontFamily: "'DM Sans'", fontWeight: 600, fontSize: 13, cursor: 'pointer',
            }}>
              <span>{label}</span>
              <span style={{
                background: weekIdx === i ? 'rgba(255,255,255,0.25)' : 'var(--orange-light)',
                color: weekIdx === i ? 'white' : 'var(--orange-d)',
                borderRadius: 20, padding: '1px 7px', fontSize: 12, fontWeight: 700,
              }}>{postsCount}/{group.memberCount}</span>
            </button>
          );
        })}
      </div>

      {/* Posts grid */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 16px 16px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {week.posts.map((post, i) => (
            <div key={post.uid} onClick={() => navigate('selfie', { post, group, weekIdx, postIdx: i })}
              style={{
                borderRadius: 18, overflow: 'hidden', cursor: 'pointer',
                background: `linear-gradient(145deg, ${post.member.color}DD 0%, ${post.member.color}88 100%)`,
                aspectRatio: '1/1.1', position: 'relative',
              }}>
              <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'rgba(255,255,255,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 700, fontSize: 22 }}>{post.member.initials}</div>
              </div>
              {post.selfReaction && (
                <div style={{ position: 'absolute', top: 8, right: 8, background: 'rgba(255,255,255,0.92)', borderRadius: 20, padding: '2px 8px', fontSize: 14 }}>{post.selfReaction}</div>
              )}
              <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '24px 10px 8px', background: 'linear-gradient(transparent, rgba(0,0,0,0.35))' }}>
                <p style={{ color: 'white', fontWeight: 600, fontSize: 13, marginBottom: 4 }}>{post.member.name.split(' ')[0]}</p>
                {post.reactions.length > 0 && (
                  <div className="reactions-scroll" style={{ display: 'flex', gap: 3, overflowX: 'auto', WebkitOverflowScrolling: 'touch' }}>
                    {post.reactions.map((r, ri) => (
                      <span key={ri} style={{ background: 'rgba(255,255,255,0.85)', borderRadius: 20, padding: '1px 5px', fontSize: 11, flexShrink: 0 }}>{r.emoji}</span>
                    ))}
                  </div>
                )}
              </div>
            </div>
          ))}

// ── SCREEN: CAMERA (disabled state) ───────────────────────────────────────────
const CameraScreen = () => {
  const countdown = useCountdown();
  const today = new Date();
  const dayOfWeek = today.getDay(); // 0=Sun

  // Weekly calendar icon — 7 columns, Sunday highlighted
  const WeekCalendar = () => {
    const days = ['L','M','X','J','V','S','D'];
    // Map JS getDay() (0=Sun,1=Mon...) to our array (0=Mon..6=Sun)
    const todayIdx = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
    return (
      <div style={{ display: 'flex', gap: 4 }}>
        {days.map((d, i) => {
          const isSun = i === 6;
          const isToday = i === todayIdx;
          return (
            <div key={i} style={{ width: 28, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
              <span style={{ fontSize: 10, color: isSun ? 'var(--orange)' : 'var(--text-3)', fontWeight: isSun ? 700 : 400 }}>{d}</span>
              <div style={{
                width: 28, height: 28, borderRadius: 8,
                background: isSun ? 'var(--orange)' : isToday ? 'var(--orange-light)' : 'var(--separator)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <span style={{ fontSize: 11, fontWeight: 600, color: isSun ? 'white' : isToday ? 'var(--orange-d)' : 'var(--text-3)' }}>
                  {/* just show day letter again smaller */}
                  {isSun ? '☀' : ''}
                </span>
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: 'var(--bg)', overflow: 'hidden' }}>
      <AppHeader/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 32px 32px', textAlign: 'center' }}>
        <div style={{ marginBottom: 28 }}>
          <WeekCalendar/>
        </div>
        <h3 style={{ fontSize: 22, fontWeight: 700, color: 'var(--text)', marginBottom: 12 }}>Tu selfie te espera el domingo</h3>
        <p style={{ color: 'var(--text-2)', fontSize: 15, lineHeight: 1.6, maxWidth: 260 }}>
          Solo puedes subir tu selfie los domingos de 00:00 a 23:59 — <span style={{ color: 'var(--orange-d)', fontWeight: 600 }}>Europe/Madrid</span>
        </p>
        <div style={{ marginTop: 28, background: 'var(--orange-light)', borderRadius: 16, padding: '14px 24px', border: '1.5px solid var(--orange-mid)' }}>
          <p style={{ color: 'var(--orange-d)', fontWeight: 700, fontSize: 20, fontFamily: 'monospace', letterSpacing: 1 }}>{countdown}</p>
          <p style={{ color: 'var(--text-3)', fontSize: 11, marginTop: 4 }}>DD:HH:MM:SS</p>
        </div>
      </div>
    </div>
  );
};

// ── MAIN APP ───────────────────────────────────────────────────────────────────
function App() {
  const [screenStack, setScreenStack] = useState([{ id: 'login', data: null }]);
  const [tab, setTab] = useState('groups');
  const current = screenStack[screenStack.length - 1];

  const navigate = useCallback((id, data = null) => {
    setScreenStack(prev => [...prev, { id, data }]);
    if (id === 'home') setTab('groups');
  }, []);

  const goBack = useCallback(() => {
    setScreenStack(prev => prev.length > 1 ? prev.slice(0, -1) : prev);
  }, []);

  const handleTab = useCallback((t) => {
    setTab(t);
    const tabMap = { groups: 'home', camera: 'camera', profile: 'profile', 'my-selfies': 'my-selfies', montaje: 'montaje' };
    setScreenStack([{ id: tabMap[t] || t, data: null }]);
  }, []);

  const isLoggedIn = !['login', 'onboarding-name', 'onboarding-photo'].includes(current.id);
  const isFullscreen = current.id === 'selfie';

  const renderScreen = () => {
    switch (current.id) {
      case 'login':            return <LoginScreen navigate={navigate}/>;
      case 'onboarding-name':  return <OnboardingName navigate={navigate}/>;
      case 'onboarding-photo': return <OnboardingPhoto navigate={navigate}/>;
      case 'home':             return <HomeScreen navigate={navigate}/>;
      case 'group':            return <GroupScreen group={current.data} navigate={navigate} goBack={goBack}/>;
      case 'selfie':           return <SelfieScreen data={current.data} navigate={navigate} goBack={goBack}/>;
      case 'members':          return <MembersScreen group={current.data} goBack={goBack}/>;
      case 'create-group':     return <CreateGroupScreen navigate={navigate} goBack={goBack}/>;
      case 'join-group':       return <JoinGroupScreen navigate={navigate} goBack={goBack}/>;
      case 'camera':           return <CameraScreen/>;
      case 'profile':          return <ProfileScreen navigate={navigate}/>;
      case 'my-selfies':       return <MySundaySelfiesScreen goBack={goBack}/>;
      case 'montaje':          return <MontajeScreen goBack={goBack}/>;
      case 'notificaciones':   return <NotificacionesScreen goBack={goBack}/>;
      case 'editar-perfil':    return <EditarPerfilScreen goBack={goBack}/>;
      case 'ajustes':          return <AjustesScreen goBack={goBack}/>;
      default:                 return <HomeScreen navigate={navigate}/>;
    }
  };

  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const update = () => {
      const s = Math.min(window.innerWidth / 420, window.innerHeight / 890, 1);
      setScale(s);
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  return (
    <div className="device-scale-wrapper" style={{ transform: `scale(${scale})` }}>
      <IOSDevice dark={isFullscreen}>
        <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'var(--bg)', overflow: 'hidden' }}>
          {renderScreen()}
          {isLoggedIn && !isFullscreen && (
            <TabBar tab={tab} onTab={handleTab}/>
          )}
        </div>
      </IOSDevice>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
<div id="root"></div>
</body>
</html>
